<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>TRON Grid World Prototype (3D Grid)</title>
<style>
  :root{--bg:#000;--hud:rgba(0,0,0,.35);--b:rgba(73,230,255,.18);--fg:rgba(220,240,255,.92)}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #hud{position:fixed;left:12px;bottom:12px;z-index:5;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;color:var(--fg);background:var(--hud);border:1px solid var(--b);border-radius:12px;padding:8px 10px;backdrop-filter:blur(4px);max-width:min(720px,calc(100vw - 24px))}
  #hud b{font-weight:800;letter-spacing:.2px}
  #hud code{background:rgba(9,7,18,.65);border:1px solid rgba(73,230,255,.18);padding:2px 6px;border-radius:10px;color:rgba(234,230,255,.95)}
  #readout{margin-top:6px;white-space:pre-wrap;opacity:.92}
  #hint{opacity:.9}
</style>
</head>
<body>
<canvas id="sim" aria-label="TRON 3D grid world"></canvas>
<div id="hud">
  <div><b>TRON Grid World</b> — 3D-perspective floor (CPU-light Canvas2D)</div>
  <div id="hint">
    Toggle <code>`</code> • Move <code>WASD</code> • Grid <code>[</code>/<code>]</code> • Tilt <code>-</code>/<code>=</code> • Pause <code>P</code> • Reset <code>R</code>
  </div>
  <div id="readout"></div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d', { alpha:false, desynchronized:true });
  const readout = document.getElementById('readout');

  // --- controls ---
  const keys = new Set();
  let show = true;
  let paused = false;

  window.addEventListener('keydown', (e) => {
    keys.add(e.code);
    if (e.key === '`') show = !show;
    if (e.code === 'KeyP') paused = !paused;
    if (e.code === 'KeyR') reset();
    if (e.code === 'BracketLeft')  gridN = Math.max(10, gridN - 4);
    if (e.code === 'BracketRight') gridN = Math.min(80, gridN + 4);
    if (e.code === 'Minus') pitch = clamp(pitch - 0.02, 0.05, 0.55);
    if (e.code === 'Equal') pitch = clamp(pitch + 0.02, 0.05, 0.55);
  });
  window.addEventListener('keyup', (e) => keys.delete(e.code));

  function resize(){
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width  = Math.max(320, Math.floor(innerWidth  * dpr));
    canvas.height = Math.max(180, Math.floor(innerHeight * dpr));
  }
  window.addEventListener('resize', resize);
  resize();

  // --- math ---
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const mod = (a,n) => ((a % n) + n) % n;
  const hypot = Math.hypot;

  // --- tunables ---
  // gridN controls how "tight" the grid looks (higher = denser).
  let gridN = 28; // 10..80

  // Perspective floor parameters (all lightweight, no matrices)
  // pitch: 0 = flat, higher = stronger perspective
  let pitch = 0.28; // 0.05..0.55

  // How wide (in pixels) one grid cell is at the bottom of the screen.
  // This is derived from gridN so density stays controlled.
  function cellPxNear(){
    // gridN=10 -> ~120px, gridN=80 -> ~28px
    return clamp(140 - gridN * 1.4, 26, 140);
  }

  // "Depth" scaling controls how fast lines converge to the horizon.
  // Smaller => more stretched perspective; larger => more subtle.
  function perspK(){
    // Keep stable across densities.
    return 0.055 + (gridN * 0.00055);
  }

  // --- player (world space) ---
  // Units are arbitrary "cells"; visuals are derived from cellPxNear.
  const player = { x: 0, y: 0, vx: 0, vy: 0 };

  function reset(){
    gridN = 28;
    pitch = 0.28;
    player.x = 0; player.y = 0;
    player.vx = 0; player.vy = 0;
  }
  reset();

  // --- neon primitive ---
  function neonLine(x0,y0,x1,y1, coreW, haloW, coreA, haloA, col){
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalCompositeOperation = 'lighter';

    // halo
    ctx.globalAlpha = haloA;
    ctx.strokeStyle = col;
    ctx.lineWidth = haloW;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();

    // core
    ctx.globalAlpha = coreA;
    ctx.lineWidth = coreW;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();

    ctx.globalAlpha = 1;
  }

  // --- simulation (fixed step) ---
  let last = performance.now();
  let acc = 0;
  const dtFixed = 1/120;

  function step(dt){
    if (paused) return;

    let mx = 0, my = 0;
    if (keys.has('KeyW')) my -= 1;
    if (keys.has('KeyS')) my += 1;
    if (keys.has('KeyA')) mx -= 1;
    if (keys.has('KeyD')) mx += 1;

    const mL = hypot(mx,my);
    if (mL > 1e-6) { mx /= mL; my /= mL; }

    // Snappy GW-ish velocity matching (lightweight)
    const SPEED = 6.2;     // world units / s
    const SNAPPY = 18.0;
    const tvx = mx * SPEED;
    const tvy = my * SPEED;

    player.vx += (tvx - player.vx) * (SNAPPY * dt);
    player.vy += (tvy - player.vy) * (SNAPPY * dt);

    player.x += player.vx * dt;
    player.y += player.vy * dt;
  }

  // --- 3D-perspective grid renderer (infinite, O(screen) not O(world)) ---
  // We render in screen space using a cheap analytic perspective.
  // Movement is achieved by phasing the line positions using player.x/y.
  function drawGrid3D(){
    const w = canvas.width;
    const h = canvas.height;

    const cx = w * 0.5;
    const horizonY = h * (0.22 + (0.18 * (0.55 - pitch))); // pitch affects horizon subtly
    const bottomY = h * 1.02;

    const near = cellPxNear();
    const k = perspK();

    // How many vertical lines to draw depends on density and resolution.
    const maxVert = clamp(Math.floor(w / Math.max(near, 18)) + 6, 18, 96);
    const halfVert = Math.floor(maxVert / 2);

    // Phase (fractional cell offset) so the grid scrolls with player motion.
    // Using modulo keeps it stable and avoids float growth issues.
    const phaseX = mod(player.x, 1.0); // 0..1
    const phaseY = mod(player.y, 1.0); // 0..1

    // --- vertical lines ---
    // Bottom endpoints are equally spaced; all converge to a vanishing point.
    // We shift their bottom endpoints by phaseX to simulate lateral movement.
    const vanishX = cx;
    const vanishY = horizonY;

    const GRID_COL = 'rgba(73,230,255,0.65)';
    const MAJOR_COL = 'rgba(255,184,77,0.85)';

    for (let i = -halfVert; i <= halfVert; i++){
      const isMajor = (i % 4) === 0;
      const sx = cx + (i - phaseX) * near;
      const ex = vanishX;
      const sy = bottomY;
      const ey = vanishY;

      const coreA = isMajor ? 0.26 : 0.18;
      const haloA = isMajor ? 0.08 : 0.05;
      neonLine(sx, sy, ex, ey, 1.2, 6.8, coreA, haloA, isMajor ? MAJOR_COL : GRID_COL);
    }

    // --- horizontal lines ---
    // We compute screen Y from a world depth d using:
    //   t = 1 / (1 + d*k)
    //   y = horizon + (bottom-horizon) * (1 - t)
    // This gives infinite lines that asymptotically approach the horizon.
    // We phase with player.y so the grid scrolls as you move.
    const maxLines = 64; // hard cap for CPU safety
    const maxD = 80;     // depth span in world units to sample

    for (let n = 0; n < maxLines; n++){
      const d = (n + phaseY) * 1.0; // 1.0 world unit per cell
      if (d > maxD) break;

      const t = 1 / (1 + d * k);
      const y = horizonY + (bottomY - horizonY) * (1 - t);

      // Width shrinks with depth (same t)
      const halfW = (w * 0.62) * t;

      const isMajor = (n % 4) === 0;
      const coreA = (isMajor ? 0.26 : 0.18) * (0.55 + 0.45 * t);
      const haloA = (isMajor ? 0.08 : 0.05) * (0.55 + 0.45 * t);

      neonLine(cx - halfW, y, cx + halfW, y, 1.2, 6.8, coreA, haloA, isMajor ? MAJOR_COL : GRID_COL);
    }

    // Subtle floor bloom
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = 'rgba(80,40,160,1)';
    ctx.fillRect(0, horizonY, w, h - horizonY);
    ctx.globalAlpha = 1;
  }

  function drawPlayerMarker(){
    const w = canvas.width;
    const h = canvas.height;
    const cx = w * 0.5;

    // Put the player slightly above the bottom so the floor reads.
    const horizonY = h * (0.22 + (0.18 * (0.55 - pitch)));
    const py = h * 0.76;

    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath(); ctx.arc(cx, py, 16, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 10; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, py, 16, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,90,230,0.85)'; ctx.lineWidth = 2.6; ctx.stroke();

    // Direction hint (uses velocity)
    const vL = Math.hypot(player.vx, player.vy);
    if (vL > 0.05){
      const dx = (player.vx / vL) * 36;
      const dy = (player.vy / vL) * 18;
      neonLine(cx, py, cx + dx, py + dy, 1.2, 6.2, 0.30, 0.07, 'rgba(255,184,77,0.95)');
    }
  }

  function draw(){
    if (!show) return;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawGrid3D();
    drawPlayerMarker();

    const near = cellPxNear();
    readout.textContent =
      `mode: 3D floor  |  paused: ${paused ? 'yes' : 'no'}\n` +
      `gridN: ${gridN}  (cell near: ${near.toFixed(0)}px)\n` +
      `pitch: ${pitch.toFixed(2)}  (tilt -/=)\n` +
      `player(world): x=${player.x.toFixed(2)} y=${player.y.toFixed(2)}`;
  }

  function frame(){
    const now = performance.now();
    let dt = (now - last) / 1000;
    last = now;
    dt = Math.min(dt, 0.05);
    acc += dt;

    while (acc >= dtFixed){
      step(dtFixed);
      acc -= dtFixed;
    }

    draw();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
